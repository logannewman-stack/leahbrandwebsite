<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"Archivo Expanded";src:url(../../assets/fonts/archivo-expanded.woff2);font-weight:800}
@font-face{font-family:"Archivo Expanded";src:url(../../assets/fonts/archivo-expanded-italic.woff2);font-weight:800;font-style:italic}
@font-face{font-family:"Geist";src:url(../../assets/fonts/geist.woff2);font-weight:100 900}
html,body{margin:0}
body{width:1200px;height:630px;position:relative;overflow:hidden;background:radial-gradient(56% 90% at 76% 42%,#2d2a27 0%,#1a1817 50%,#100f0e 100%);color:#fff;font-family:"Geist",sans-serif}
.photo{position:absolute;right:0;top:0;height:100%;aspect-ratio:1200/1680;-webkit-mask-image:linear-gradient(90deg,transparent 2%,#000 36%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 2%,#000 36%,#000 86%,transparent 100%)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.copy{position:absolute;left:80px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.logo{display:grid;margin-bottom:54px;font:800 26px/.98 "Archivo Expanded";letter-spacing:-.02em}
.logo span:last-child{color:#f3c5ce}
h1{display:grid;margin:0;font:800 92px/1 "Archivo Expanded";letter-spacing:-.035em}
h1 span{width:fit-content;padding-right:.06em;background:linear-gradient(96deg,#f9d6dc 0%,#f1c5c1 46%,#d9b17b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 em{font-style:italic}
p{max-width:430px;margin:34px 0 0;font-size:23px;line-height:1.42;color:#efebe6}
</style></head><body>
<div class="photo"><img src="../../assets/img/leah-portrait-bw-1200.webp" alt=""></div>
<div class="copy">
  <div class="logo"><span>Leah</span><span>Roling</span></div>
  <h1><span>Learn it.</span><em>Live it.</em><span>Lead it.</span></h1>
  <p>You were taught how to build a life. You were never taught how to live one.</p>
</div>
</body></html>
