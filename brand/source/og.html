<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(../../assets/fonts/fraunces-roman.woff2);font-weight:100 900}
@font-face{font-family:F;src:url(../../assets/fonts/fraunces-italic.woff2);font-style:italic;font-weight:100 900}
@font-face{font-family:S;src:url(../../assets/fonts/instrument-sans-roman.woff2);font-weight:400 700}
html,body{margin:0}
body{width:1200px;height:630px;background:#F6F0E7;position:relative;overflow:hidden;font-family:S;color:#1C1815}
.glow{position:absolute;right:-160px;top:-200px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(235,211,203,.95),rgba(235,211,203,0) 66%)}
.l{position:absolute;left:72px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.lockup{height:58px;align-self:flex-start;margin-bottom:54px}
h1{font-family:F;font-weight:330;font-variation-settings:"SOFT" 60,"WONK" 0;font-size:84px;line-height:.95;letter-spacing:-.04em;margin:0}
h1 em{font-style:italic;font-weight:300;font-variation-settings:"SOFT" 100,"WONK" 1;color:#7E1F2C}
p{margin:34px 0 0;font-size:15px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:#7E1F2C}
.arch{position:absolute;right:72px;bottom:0;width:380px;height:540px;border-radius:999px 999px 0 0;overflow:hidden}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.outline{position:absolute;right:56px;bottom:40px;width:380px;height:546px;border:1.5px solid #B08D57;border-bottom:0;border-radius:999px 999px 0 0}
.key{position:absolute;right:240px;top:34px;width:14px;height:20px;background:#B08D57;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
</style></head><body>
<div class="glow"></div>
<div class="l"><img class="lockup" src="../logos/leah-roling-lockup.svg">
<h1>Become who<br>you were <em>made</em><br>to be.</h1>
<p>Coach · Author · Speaker</p></div>
<div class="outline"></div><span class="key"></span>
<div class="arch"><img src="../../assets/img/leah-portrait-bw-720.webp"></div>
</body></html>
